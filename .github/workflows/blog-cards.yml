name: Update Zenn Qiita Speaker Deck and GitHub cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate cards from public Zenn/Qiita/Speaker Deck/GitHub data
        run: python3 scripts/generate-blog-cards.py
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/badges/zenn-likes.svg public/images/badges/zenn-likes-light.svg public/images/badges/qiita-contributions.svg public/images/badges/qiita-contributions-light.svg public/images/badges/speakerdeck-views.svg public/images/badges/speakerdeck-views-light.svg public/images/badges/github-contrib-stats.svg public/images/badges/github-contrib-stats-light.svg
          if git diff --cached --quiet; then
            echo "No card changes"
            exit 0
          fi
          git commit -m "Zenn/Qiita/Speaker Deck/GitHub カードの数字を公開データから更新"
          git push
