name: Latest blog post workflow
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pull in AoToLog posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          comment_tag_name: AOTOLOG-POST-LIST
          feed_list: "https://www.aotolog.com/index.xml"
          max_post_count: 5
          skip_commit: true
          enable_keepalive: false
          tag_post_pre_newline: true
          template: '<tr><td align="center" valign="top" width="56"><a href="$url"><img src="./public/images/posts/icon-aotolog.svg" width="56" alt="AoToLog post" /></a></td><td valign="middle"><a href="$url">$title</a></td></tr>'
      - name: Pull in Zenn posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          comment_tag_name: ZENN-POST-LIST
          feed_list: "https://zenn.dev/aotolog/feed"
          max_post_count: 5
          skip_commit: true
          enable_keepalive: false
          tag_post_pre_newline: true
          template: '<tr><td align="center" valign="top" width="56"><a href="$url"><img src="./public/images/posts/icon-zenn.svg" width="56" alt="Zenn post" /></a></td><td valign="middle"><a href="$url">$title</a></td></tr>'
      - name: Pull in Qiita posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          comment_tag_name: QIITA-POST-LIST
          feed_list: "https://qiita.com/aoto0330/feed"
          max_post_count: 5
          enable_keepalive: false
          tag_post_pre_newline: true
          commit_message: "Update README with latest blog posts"
          template: '<tr><td align="center" valign="top" width="56"><a href="$url"><img src="./public/images/posts/icon-qiita.svg" width="56" alt="Qiita post" /></a></td><td valign="middle"><a href="$url">$title</a></td></tr>'
